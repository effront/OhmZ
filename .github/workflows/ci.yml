name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: Zig Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Check formatting
        run: zig fmt --check src/ build.zig

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Run tests
        run: zig build test

  build:
    name: Build (${{ matrix.arch }})
    needs: [fmt, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux
          - arch: aarch64
            target: aarch64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Verify binary
        if: matrix.arch == 'x86_64'
        run: |
          file zig-out/bin/ohmz
          ls -lh zig-out/bin/ohmz

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ohmz-linux-${{ matrix.arch }}
          path: zig-out/bin/ohmz

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
        with:
          path: ./
          extra_args: --only-verified

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [fmt, test, build, security]
    if: always()
    steps:
      - name: Write Summary
        run: |
          status() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              *)       echo "skip" ;;
            esac
          }
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## CI Summary

          | Check | Status |
          |-------|--------|
          | Zig Format | $(status "${{ needs.fmt.result }}") |
          | Unit Tests | $(status "${{ needs.test.result }}") |
          | Build | $(status "${{ needs.build.result }}") |
          | Security | $(status "${{ needs.security.result }}") |
          EOF
