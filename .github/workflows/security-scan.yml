name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --json \
            --output=semgrep-report.json \
            --exclude 'zig-out/' \
            --exclude '.zig-cache/' \
            --exclude 'zig-cache/' \
            || true

      - name: Parse Results
        id: parse
        run: |
          TOTAL=$(jq '.results | length' semgrep-report.json)
          ERRORS=$(jq '.results | map(select(.extra.severity == "ERROR")) | length' semgrep-report.json)
          WARNINGS=$(jq '.results | map(select(.extra.severity == "WARNING")) | length' semgrep-report.json)
          CRITICAL=$(jq '.results | map(select(.extra.metadata.confidence == "HIGH" and (.extra.metadata.subcategory // "vuln") != "audit")) | length' semgrep-report.json)

          echo "errors=$ERRORS"     >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "::notice::Total: $TOTAL - errors: $ERRORS, warnings: $WARNINGS, critical: $CRITICAL"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::group::ERROR Severity Issues"
            jq -r '.results[] | select(.extra.severity == "ERROR") | "  - \(.path):\(.start.line) - \(.check_id)"' semgrep-report.json
            echo "::endgroup::"
          fi

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const errors   = '${{ steps.parse.outputs.errors }}';
            const warnings = '${{ steps.parse.outputs.warnings }}';
            const critical = '${{ steps.parse.outputs.critical }}';
            const body = `## Semgrep Static Analysis

            | Severity | Count |
            |----------|-------|
            | Errors   | ${errors} |
            | Critical (HIGH confidence) | ${critical} |
            | Warnings | ${warnings} |

            ${errors > 0 ? 'Security errors found! Fix before merging.'
              : critical > 0 ? 'High confidence issues found. Please review.'
              : warnings > 0 ? 'Warnings found (non-blocking).'
              : 'No issues found.'}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on Critical Errors
        if: steps.parse.outputs.errors > 0
        run: |
          echo "::error::Semgrep found ${{ steps.parse.outputs.errors }} ERROR severity issues."
          exit 1

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@2caa45cf2210ad5660671fcd4c6a8eb6eb98a96b # main
        with:
          path: ./
          extra_args: --only-verified

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep, secret-scan]
    if: always()
    steps:
      - name: Write Step Summary
        run: |
          status() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              *)       echo "skip" ;;
            esac
          }
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Security Scan Summary

          | Check | Status |
          |-------|--------|
          | Semgrep | $(status "${{ needs.semgrep.result }}") ${{ needs.semgrep.result }} |
          | Secret Detection | $(status "${{ needs.secret-scan.result }}") ${{ needs.secret-scan.result }} |
          EOF

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const semgrep = '${{ needs.semgrep.result }}';
            const secrets = '${{ needs.secret-scan.result }}';
            const allPassed = [semgrep, secrets].every(r => r === 'success');

            const body = `## Security Scan Summary

            | Check | Status |
            |-------|--------|
            | Semgrep | ${semgrep} |
            | Secret Detection | ${secrets} |

            ${allPassed ? 'All security checks passed!' : 'Some checks failed - review the details above.'}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
