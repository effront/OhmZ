name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux
            artifact: ohmz-linux-x86_64
          - arch: aarch64
            target: aarch64-linux
            artifact: ohmz-linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Zig
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/zig
          key: zig-0.14.1-x86_64

      - name: Setup Zig
        run: |
          if [ ! -f ~/zig/zig ]; then
            mkdir -p ~/zig
            curl -sL https://ziglang.org/download/0.14.1/zig-linux-x86_64-0.14.1.tar.xz \
              | tar -xJ --strip-components=1 -C ~/zig
          fi
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Run tests
        if: matrix.arch == 'x86_64'
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/ohmz dist/
          cp README.md dist/
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          generate_release_notes: true
          files: |
            release-assets/ohmz-linux-x86_64/*.tar.gz
            release-assets/ohmz-linux-aarch64/*.tar.gz
