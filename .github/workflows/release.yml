name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux
            artifact: ohmz-linux-x86_64
            deb_arch: amd64
          - arch: aarch64
            target: aarch64-linux
            artifact: ohmz-linux-aarch64
            deb_arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Run tests
        if: matrix.arch == 'x86_64'
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/ohmz dist/
          cp README.md dist/
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz .

      - name: Package .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p deb/DEBIAN deb/usr/local/bin
          cp zig-out/bin/ohmz deb/usr/local/bin/
          chmod 755 deb/usr/local/bin/ohmz
          printf 'Package: ohmz\n' > deb/DEBIAN/control
          printf 'Version: %s\n' "$VERSION" >> deb/DEBIAN/control
          printf 'Architecture: ${{ matrix.deb_arch }}\n' >> deb/DEBIAN/control
          printf 'Maintainer: effront <security@effront.gg>\n' >> deb/DEBIAN/control
          printf 'Description: High-performance network scanner\n' >> deb/DEBIAN/control
          printf ' SYN scan, banner grabbing, BlackRock randomization.\n' >> deb/DEBIAN/control
          printf ' Static binary, no dependencies.\n' >> deb/DEBIAN/control
          printf 'Homepage: https://github.com/effront/OhmZ\n' >> deb/DEBIAN/control
          printf 'Priority: optional\n' >> deb/DEBIAN/control
          printf 'Section: net\n' >> deb/DEBIAN/control
          dpkg-deb --build deb "ohmz_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ohmz_*_${{ matrix.deb_arch }}.deb

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release-assets/ohmz-linux-x86_64/*.tar.gz
            release-assets/ohmz-linux-x86_64/*.deb
            release-assets/ohmz-linux-aarch64/*.tar.gz
            release-assets/ohmz-linux-aarch64/*.deb
